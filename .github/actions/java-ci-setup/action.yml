name: Java CI Setup

description: Setup Java and build project

inputs:
  java-version:
    description: Java Version
    required: true
    default: '21'

  working-directory:
    description: Working Directory
    required: false
    default: '.'

outputs:
  installed-version:
    description: Installed Java Version
    value: ${{ steps.java.outputs.version }}

runs:
  using: composite

  steps:
    - name: Setup Java
      id: java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Build Project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mvn clean install
