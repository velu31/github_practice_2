name: 27 - Reusable Java Test (callee)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to test against'
        required: false
        type: string
        default: '21'

      working-directory:
        description: 'Folder containing pom.xml'
        required: false
        type: string
        default: 'springboot-no-db'

      run-tests:
        description: 'Run Maven tests'
        required: false
        type: boolean
        default: true

    secrets:
      API_KEY:
        required: false

    outputs:
      tested-version:
        description: 'Java version that actually ran'
        value: ${{ jobs.run-tests.outputs.java-version }}

jobs:
  run-tests:
    runs-on: ubuntu-latest

    outputs:
      java-version: ${{ steps.report.outputs.version }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Verify Maven
        run: mvn -version

      - name: Compile
        run: mvn clean compile

      - name: Run Tests
        if: inputs.run-tests
        run: mvn test

      - name: Use Secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API_KEY supplied."
          else
            echo "No API_KEY supplied."
          fi

      - name: Report back to caller
        id: report
        run: echo "version=${{ inputs.java-version }}" >> "$GITHUB_OUTPUT"
