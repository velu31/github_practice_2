
name: Java Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: springboot-no-db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Application
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: springboot-no-db/target/*.jar
          retention-days: 7
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: downloaded-jar

      - name: Verify Downloaded Files
        run: |
          echo "This is a new runner"
          echo "Artifact downloaded successfully"
          ls -R downloaded-jar

      - name: Show JAR File
        run: |
          find downloaded-jar -name "*.jar"
