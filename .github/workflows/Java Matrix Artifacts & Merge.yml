name: 26 - Java Matrix Artifacts & Merge

on:
  workflow_dispatch

jobs:

  test:

    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        java: [17, 21, 24]

    defaults:
      run:
        working-directory: springboot-no-db

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Run tests and save report
        run: |
          mkdir -p reports

          mvn test > reports/results-java-${{ matrix.java }}.txt 2>&1

      - name: Upload this row report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-java-${{ matrix.java }}
          path: springboot-no-db/reports/
          retention-days: 5

  merge-reports:

    needs: test
    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Merge all reports
        uses: actions/upload-artifact/merge@v4
        with:
          name: all-test-reports
          pattern: report-*
          delete-merged: true

  summarise:

    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: all-reports

      - name: Build Summary
        run: |
          ls -R all-reports

          {
            echo "## Java Test Reports"
            echo ""

            for f in all-reports/*.txt; do
              echo "- $(basename "$f")"
            done

          } >> "$GITHUB_STEP_SUMMARY"
