name: 29 - Composite Action Java

on:
  workflow_dispatch

jobs:
  the-short-way:
    name: Use Composite Action
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: springboot-no-db

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java and Build
        id: setup
        uses: ./.github/actions/java-ci-setup
        with:
          java-version: '21'
          working-directory: 'springboot-no-db'

      - name: Run Tests
        run: mvn test
