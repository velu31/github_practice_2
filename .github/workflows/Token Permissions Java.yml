name: 30 - Token Permissions Java

on:
  workflow_dispatch

permissions:
  contents: read

jobs:

  inspect-defaults:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: springboot-no-db

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Read Repository Through API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Reading repository metadata..."
          gh api "repos/${{ github.repository }}" \
            --jq '.full_name, .visibility'

      - name: Build Project
        run: mvn clean install

      - name: Run Tests
        run: mvn test

  needs-more:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    defaults:
      run:
        working-directory: springboot-no-db

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Project
        run: mvn clean install

      - name: Create Issue Example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Build Verification Required" \
            --body "Java build completed successfully."

  zero-permissions:
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Pure Computation
        run: |
          echo "2 + 2 = 4"

      - name: Verify No Write Access
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues" \
            -f title="Should Fail" \
            && echo "Unexpected Success" \
            || echo "Expected Failure"
